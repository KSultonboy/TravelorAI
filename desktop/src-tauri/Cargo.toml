[package]
name = "travelorai-crm"
version = "1.0.1"
description = "TravelorAI CRM — agentlik kabineti"
authors = ["TravelorAI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Release build — POC uchun tez kompilyatsiya (LTO'siz), lekin ixcham
[profile.release]
opt-level = "s"
strip = true
