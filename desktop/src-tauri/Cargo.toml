[package]
name = "travelorai-crm"
version = "1.0.6"
description = "TravelorAI CRM — agentlik kabineti"
authors = ["TravelorAI"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
# Tashqi havolani tizim brauzeri/ilovasida ochish (open_external buyrug'i).
# Tauri webview target="_blank" ni ochmaydi — shu sababli kerak.
# 5.4+ — Windows'da `cmd /c start` (argument injection xavfi) ishlatilmaydi; u faqat
# `insecure` feature bilan yoqiladi — uni YOQMANG. 6.x API o'zgarishi mumkin — majoriy
# versiyani qo'lda tekshirib ko'taring.
open = ">=5.4, <6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native "Ha/Yo'q" tasdiq oynasi (MessageBoxW) — install_update va save_download uchun.
# YANGI crate emas: tauri 2.x o'zi aynan shu versiya va feature'lar bilan `windows`ni
# ishlatadi (Cargo.lock'da windows 0.61.3). Versiyani tauri bilan birga yangilang.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

# Release build — POC uchun tez kompilyatsiya (LTO'siz), lekin ixcham
[profile.release]
opt-level = "s"
strip = true
