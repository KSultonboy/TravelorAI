# TravelorAI CRM — ilovaning O'Z buyruqlariga ruxsat.
#
# Tauri v2'da remote sahifa (travelorai.com) ilova buyruqlarini chaqirishi
# uchun ACL'da ochiq bo'lishi SHART — aks holda:
#   "Command check_update not allowed by ACL"
#
# Bu yerda FAQAT o'zimiz yozgan buyruqlar ochiladi. Fayl tizimi, shell
# (buyruq bajarish) va boshqa hech narsa berilmaydi.
#
# open_external — tashqi havolani tizim brauzeri/ilovasida ochadi. Rust
# tomonida sxema qat'iy tekshiriladi (https/http/tel/mailto), shuning uchun
# bu "istalgan narsani ishga tushirish" imkoniyati emas.

[[permission]]
identifier = "allow-update-commands"
description = "Ilovaning o'z buyruqlari: yangilanishni tekshirish/o'rnatish va tashqi havolani ochish."
commands.allow = ["check_update", "install_update", "open_external"]
