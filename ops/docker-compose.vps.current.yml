version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: travelorai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travelorai_db}
      POSTGRES_USER: ${POSTGRES_USER:-travelorai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travelorai} -d ${POSTGRES_DB:-travelorai_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: travelorai_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travelorai_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-travelorai}:${POSTGRES_PASSWORD}@127.0.0.1:5433/${POSTGRES_DB:-travelorai_db}
      REDIS_URL: redis://127.0.0.1:6380
      NODE_ENV: production
    volumes:
      - ./backend/uploads:/app/uploads
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
