# TravelorAI — host nginx vhost for travelorai.com (production, 178.18.245.174).
#
# CANONICAL copy. This is the only nginx config for TravelorAI in the repo.
# Server path: /etc/nginx/sites-available/travelorai.com (symlinked from sites-enabled).
# The server is SHARED with other projects: everything here is scoped to this
# vhost, and the http-level names (limit_req_zone, map) are prefixed
# `travelorai_` so they cannot collide with other vhosts.
#
# Upstreams (podman, --network host, loopback only):
#   127.0.0.1:4000  voyageai_backend   (Express API, /api/*, /uploads/*, /health)
#   127.0.0.1:3100  travelorai_website (Next.js, / and the Next route handlers
#                   /api/admin-auth/, /api/admin-proxy/, /api/agency-proxy/)
#
# TLS: certificates are issued and renewed by certbot (nginx plugin). The
# ssl_* / include lines below are the ones certbot writes — when applying this
# file, keep whatever certbot has in the live file for those lines.
# HTTP -> HTTPS: port 80 only redirects (certbot's renew uses its own temporary
# challenge config, so no acme location is needed here).
#
# Apply (on the server, by a human):
#   cp /etc/nginx/sites-available/travelorai.com /root/travelorai.com.conf.bak-$(date +%F)
#   install -m 644 travelorai.com.conf /etc/nginx/sites-available/travelorai.com
#   nginx -t && systemctl reload nginx
#   # rollback: copy the .bak back, nginx -t && systemctl reload nginx

# ---------------------------------------------------------------- http-level
# (sites-enabled/* is included inside the http {} block)

# Brute-force protection for credential endpoints: 10 req/min per client IP,
# burst 20. Only POST is counted (empty key = not limited), so GET /auth/me,
# /auth/session etc. are never throttled — important behind mobile CGNAT.
map $request_method $travelorai_auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $travelorai_auth_limit_key zone=travelorai_auth:10m rate=10r/m;

map $http_upgrade $travelorai_connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- :80
server {
    listen 80;
    listen [::]:80;
    server_name travelorai.com www.travelorai.com;
    server_tokens off;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------- :443
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name travelorai.com www.travelorai.com;

    ssl_certificate /etc/letsencrypt/live/travelorai.com/fullchain.pem;       # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/travelorai.com/privkey.pem;     # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;                          # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                            # managed by Certbot

    server_tokens off;
    client_max_body_size 20M;

    # --- security headers --------------------------------------------------
    # Upstream copies (helmet etc.) are hidden so each header is sent once.
    # NOTE: any `add_header` inside a location would disable these for that
    # location — do not add one there; set headers here instead.
    proxy_hide_header X-Powered-By;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    # No includeSubDomains/preload until every *.travelorai.com host is HTTPS-only.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy is owned by the website (next.config / middleware).

    # --- compression ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml application/manifest+json image/svg+xml;

    # --- proxy defaults (inherited by every location below) ------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $travelorai_connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 120s;
    limit_req_status 429;

    # --- website (Next.js route handlers under /api/) ------------------------
    location /api/admin-auth/ {
        limit_req zone=travelorai_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }

    location /api/admin-proxy/ {
        proxy_pass http://127.0.0.1:3100;
    }

    location /api/agency-proxy/ {
        proxy_pass http://127.0.0.1:3100;
    }

    # --- backend: credential endpoints (rate limited) ------------------------
    # Regex beats the /api/ prefix below. Users: /api/v1/auth/*, agencies: /api/v1/agency/auth/*.
    location ~ ^/api/v1/(auth|agency/auth)/(login|register|google|verify-email|resend-verification|forgot-password|reset-password)$ {
        limit_req zone=travelorai_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:4000;
    }

    # --- backend --------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/api/v1/health;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
    }

    # --- website ----------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3100;
    }
}
